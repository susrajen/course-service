apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cloudstudents
  name: deployment-2048-sush
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: app-2048-sush
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-2048-sush
    spec:
      containers:
      - image: public.ecr.aws/l6m2t8p7/docker-2048:latest
        imagePullPolicy: Always
        name: app-2048-sush
        ports:
        - containerPort: 80

        env:
        - name: AWS_REGION
          value: "ap-south-2"
        - name: COURSE_SERVICE_URL
          value: ""
---
apiVersion: v1
kind: Service
metadata:
  namespace: cloudstudents
  name: service-2048-sush
spec:
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: NodePort
  selector:
    app.kubernetes.io/name: app-2048-sush
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: cloudstudents
  name: ingress-2048-sush
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: service-2048-sush
              port:
                number: 80