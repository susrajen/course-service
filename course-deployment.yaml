apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cloudstudents
  name: deployment-2048-sush
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: student-service
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: student-service
    spec:
      containers:
      - image: 991524241826.dkr.ecr.ap-south-2.amazonaws.com/sush-course-repo:latest
        imagePullPolicy: Always
        name: student-service
        ports:
        - containerPort: 3001
        env:
        - name: AWS_REGION
          value: "ap-south-2"
        - name: COURSE_SERVICE_URL
          value: ""

---
apiVersion: v1
kind: Service
metadata:
  namespace: cloudstudents
  name: service-2048-sush
spec:
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
  type: NodePort
  selector:
    app.kubernetes.io/name: student-service

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: cloudstudents
  name: ingress-2048-sush
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    alb.ingress.kubernetes.io/group.name: students-app

    alb.ingress.kubernetes.io/healthcheck-path: /sush-course/health

spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
        - path: /sush-course
          pathType: Prefix
          backend:
            service:
              name: service-2048-sush
              port:
                number: 3001